<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0c0a;
      --ink: #f0ebe0;
      --blue: rgb(13, 25, 180);
      --muted: #5a5550;
      --line: #2a2622;
      --green: #3ddc84;
      --panel: rgba(14,12,10,0.96);
      --bar: 1.8rem;
    }

    html, body { height: 100%; width: 100%; overflow: hidden;
      background: #000; color: var(--ink);
      font-family: 'Space Mono', monospace; }

    /* Hydra canvas — stretches inside #shell, behind editors */
    #hc {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 1; display: none; pointer-events: none;
    }

    #shell {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
    }

    /* Top bar */
    #topbar {
      height: var(--bar); flex-shrink: 0;
      display: flex; align-items: stretch;
      border-bottom: 1px solid var(--line);
      background: transparent;
      position: relative; z-index: 10;
    }

    #back-cell {
      display: flex; align-items: center;
      padding: 0 0.9rem;
      border-right: 1px solid var(--line); flex-shrink: 0;
      background: transparent;
    }

    .back-link {
      text-decoration: none; color: var(--muted);
      font-size: 0.6rem; letter-spacing: 0.12em;
      text-transform: uppercase; white-space: nowrap;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--ink); }

    #pane-headers { flex: 1; display: flex; align-items: stretch; min-width: 0; }

    .ph {
      flex: 1; display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 0.5rem 0 0.5rem;
      border-right: 1px solid var(--line);
      position: relative; min-width: 0;
    }
    .ph:last-child { border-right: none; }

    .target-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-family: 'Space Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.15rem 0.3rem;
      display: flex; align-items: center; gap: 0.3rem;
      transition: color 0.15s;
    }
    .target-btn:hover { color: var(--ink); }
    .target-btn .caret { opacity: 0.45; font-size: 0.5rem; }

    .target-dd {
      position: fixed;
      background: #1a1714; border: 1px solid var(--line);
      z-index: 9999; display: none; flex-direction: column;
      min-width: 140px; box-shadow: 0 4px 16px rgba(0,0,0,0.7);
    }
    .target-dd.open { display: flex; }

    .topt {
      padding: 0.7rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: color 0.15s, background 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .topt:last-child { border-bottom: none; }
    .topt:hover, .topt:active { color: var(--ink); background: rgba(255,255,255,0.07); }
    .topt.active { color: var(--blue); }

    .ph-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.6rem; padding: 0.15rem 0.3rem;
      opacity: 0; transition: opacity 0.15s, color 0.15s; line-height: 1;
    }
    .ph:hover .ph-close { opacity: 0.4; }
    .ph-close:hover { opacity: 1 !important; color: var(--ink); }

    #cmd-cell {
      display: flex; align-items: center;
      padding: 0 0.85rem;
      border-left: 1px solid var(--line); flex-shrink: 0;
    }

    .chrome-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-family: 'Space Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      transition: color 0.2s;
    }
    .chrome-btn:hover { color: var(--ink); }

    /* Panes */
    #panes { flex: 1; display: flex; min-height: 0; position: relative; z-index: 10; }

    .pane {
      flex: 1; position: relative;
      display: flex; flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--line);
      /* transparent — canvas shows through */
      background: transparent;
    }
    .pane:last-child { border-right: none; }

    /* Non-hydra: transparent editor, hydra shows through everywhere */
    .pane:not(.is-hydra) .pane-editor { background: transparent; }

    /* Hydra: editor transparent, text readable over visuals */
    .pane.is-hydra .pane-editor {
      background: transparent !important;
      color: rgba(240,235,224,0.92);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .pane-editor {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none; outline: none;
      color: var(--ink);
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
      font-family: 'Space Mono', monospace;
      font-size: 0.88rem; line-height: 1.75;
      padding: 1.4rem 2rem 4rem;
      resize: none; caret-color: var(--blue);
      tab-size: 2; z-index: 10;
    }

    .se {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; opacity: 0; pointer-events: none; z-index: 0;
    }

    /* Bottom bar */
    #botbar {
      height: var(--bar); flex-shrink: 0;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      border-top: 1px solid var(--line);
      background: transparent;
      position: relative; z-index: 10;
    }

    .bot-l { display: flex; align-items: center; gap: 0.6rem; }

    .sdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); transition: background 0.3s; flex-shrink: 0;
    }
    .sdot.playing { background: var(--green); }
    .sdot.error   { background: #e05030; }

    /* Log */
    #log {
      position: fixed;
      bottom: calc(var(--bar) + 0.5rem);
      left: 50%; transform: translateX(-50%);
      width: min(500px, 74vw); max-height: 130px; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--line);
      display: none; flex-direction: column-reverse;
      z-index: 400; font-size: 0.63rem; line-height: 1.7;
    }
    #log.vis { display: flex; }
    .ll { padding: 0.22rem 0.75rem; color: var(--muted); border-top: 1px solid var(--line); }
    .ll:first-child { border-top: none; }
    .ll.ok   { color: var(--green); }
    .ll.err  { color: #e06050; }
    .ll.info { color: var(--ink); }

    /* Palette */
    #pal-bg {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(14,12,10,0.55); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
    }
    #pal-bg.open { display: flex; }

    #pal {
      background: #1a1714; border: 1px solid var(--line);
      width: min(460px, 88vw); display: flex; flex-direction: column;
    }

    #pal-top {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.8rem 1rem; border-bottom: 1px solid var(--line);
    }

    #pal-in {
      background: none; border: none; outline: none;
      color: var(--ink); font-family: 'Space Mono', monospace;
      font-size: 0.78rem; width: 100%;
    }
    #pal-in::placeholder { color: var(--muted); }
    .si { color: var(--muted); font-size: 0.72rem; }

    .ps { padding: 0.5rem 1rem 0.2rem; font-size: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0.55; }
    .pi { padding: 0.62rem 1rem; font-size: 0.7rem; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 0.65rem; transition: background 0.1s, color 0.1s; }
    .pi:hover, .pi.focused { background: rgba(255,255,255,0.04); color: var(--ink); }
    .pi .ico { width: 1rem; text-align: center; }
    .pi .sc { margin-left: auto; font-size: 0.5rem; opacity: 0.4; }
    .pt { padding: 0.4rem 1rem; font-size: 0.52rem; color: var(--muted); opacity: 0.4; border-top: 1px solid var(--line); }



    /* Hide strudel-editor's own UI (sliders, buttons etc) — we drive it headlessly */
    strudel-editor {
      position: absolute !important;
      width: 1px !important; height: 1px !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -1 !important;
      /* Also suppress any overflow panels it might render outside its box */
      clip: rect(0,0,0,0) !important;
      clip-path: inset(50%) !important;
    }
    /* Catch any portaled/fixed controls the component might inject */
    .strudel-controls,
    .strudel-slider,
    [data-strudel-controls] {
      display: none !important;
    }


    /* ── SLIDER BAR ──────────────────────────────── */
    #slider-panel {
      position: fixed;
      bottom: var(--bar);
      left: 0; right: 0;
      background: rgba(14,12,10,0.88);
      border-top: 1px solid var(--line);
      z-index: 50;
      display: none;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      min-height: 2.6rem;
      backdrop-filter: blur(4px);
    }
    #slider-panel.vis { display: flex; }

    .sl-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      height: 2.6rem;
      border-right: 1px solid var(--line);
      min-width: 160px;
      flex: 0 0 auto;
    }

    .sl-name {
      font-size: 0.58rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--blue);
      font-family: 'Space Mono', monospace;
      white-space: nowrap; flex-shrink: 0;
      min-width: 1.5rem;
    }

    .sl-range {
      -webkit-appearance: none;
      width: 90px; height: 3px;
      background: var(--line);
      outline: none; cursor: pointer;
      border-radius: 0; flex-shrink: 0;
    }
    .sl-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      background: var(--blue); border-radius: 50%;
      cursor: pointer;
    }
    .sl-range::-moz-range-thumb {
      width: 11px; height: 11px;
      background: var(--blue); border-radius: 50%;
      border: none; cursor: pointer;
    }

    .sl-value-display {
      font-size: 0.6rem; color: var(--muted);
      font-family: 'Space Mono', monospace;
      min-width: 3.2rem; text-align: right;
      flex-shrink: 0;
    }

    .sl-remove {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.6rem;
      padding: 0; opacity: 0;
      transition: opacity 0.15s, color 0.15s; line-height: 1;
      flex-shrink: 0;
    }
    .sl-item:hover .sl-remove { opacity: 0.5; }
    .sl-remove:hover { opacity: 1 !important; color: var(--ink); }

    #slider-panel-close {
      margin-left: auto;
      padding: 0 0.75rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.65rem;
      transition: color 0.15s; flex-shrink: 0;
      align-self: stretch;
      display: flex; align-items: center;
    }
    #slider-panel-close:hover { color: var(--ink); }

    #slider-empty {
      padding: 0 1rem;
      font-size: 0.62rem; color: var(--muted);
      font-style: italic;
    }

    /* ── PREBAKE MODAL ──────────────────────────── */
    #pb-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(14,12,10,0.7);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
    }
    #pb-overlay.open { display: flex; }

    #pb-modal {
      background: #131210; border: 1px solid var(--line);
      width: min(600px, 92vw);
      display: flex; flex-direction: column;
      max-height: 80vh;
    }

    #pb-modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    #pb-modal-head h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1rem; font-weight: 400; font-style: italic;
      color: var(--blue);
    }

    .pb-close-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1rem; line-height: 1;
      transition: color 0.15s;
    }
    .pb-close-btn:hover { color: var(--ink); }

    .pb-tabs {
      display: flex; border-bottom: 1px solid var(--line);
    }

    .pb-tab {
      padding: 0.6rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); cursor: pointer;
      border-right: 1px solid var(--line);
      position: relative; transition: color 0.15s;
    }
    .pb-tab.active { color: var(--ink); }
    .pb-tab.active::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0; right: 0; height: 2px;
      background: var(--blue);
    }

    .pb-section {
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 0.6rem;
    }

    .pb-label {
      font-size: 0.58rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted);
    }

    .pb-url-row {
      display: flex; gap: 0.5rem;
    }

.pb-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.45rem 0.9rem; cursor: pointer; border: 1px solid;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    .pb-btn-primary { background: var(--blue); border-color: var(--blue); color: var(--ink); }
    .pb-btn-primary:hover { background: transparent; color: var(--blue); }
    .pb-btn-ghost { background: transparent; border-color: var(--muted); color: var(--muted); }
    .pb-btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

    .pb-textarea {
      width: 100%; min-height: 180px; max-height: 260px;
      background: #0a0908; border: 1px solid var(--line);
      color: var(--ink); font-family: 'Space Mono', monospace;
      font-size: 0.75rem; line-height: 1.65;
      padding: 0.7rem; resize: vertical; outline: none;
      tab-size: 2; transition: border-color 0.15s;
    }
    .pb-textarea:focus { border-color: var(--blue); }
    .pb-textarea::placeholder { color: var(--muted); }

    .pb-status {
      font-size: 0.6rem; letter-spacing: 0.08em;
      color: var(--muted); min-height: 1rem;
    }
    .pb-status.ok  { color: var(--green); }
    .pb-status.err { color: #e06050; }

    .pb-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem; gap: 0.75rem;
    }

    .pb-active-pill {
      font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--green); display: none;
    }
    .pb-active-pill.visible { display: block; }

    /* Flash */
    #flash { position: fixed; inset: 0; background: rgba(13,25,180,0.05); pointer-events: none; opacity: 0; z-index: 300; transition: opacity 0.07s; }
    #flash.on { opacity: 1; }
  </style>
</head>
<body>

<div id="shell">
<canvas id="hc"></canvas>
  <div id="topbar">
    <div id="back-cell"><a href="index.html" class="back-link">← maiasullivan.com</a></div>
    <div id="pane-headers"></div>
    <div id="cmd-cell"><button class="chrome-btn" onclick="openPal()" title="Ctrl+J">⌘</button></div>
  </div>
  <div id="panes"></div>
  <div id="botbar">
    <div class="bot-l">
      <span class="sdot" id="sdot"></span>
      <button class="chrome-btn" onclick="toggleLog()">log</button>
    </div>
    <button class="chrome-btn" onclick="silenceAll()">silence ·</button>
  </div>
</div>

<div id="pal-bg" onclick="palBgClick(event)">
  <div id="pal">
    <div id="pal-top">
      <span class="si">⌕</span>
      <input id="pal-in" placeholder="command or search…" oninput="filterPal(this.value)" onkeydown="palNav(event)" />
    </div>
    <div id="pal-body"></div>
    <div class="pt">Ctrl+J / Cmd+J to toggle</div>
  </div>
</div>



<!-- Slider Panel -->
<div id="slider-panel">
  <div id="slider-panel-head">
    <span>sliders</span>
    <div style="display:flex;gap:1rem;align-items:center">
<button class="sl-panel-close" onclick="toggleSliders()">✕</button>
    </div>
  </div>
  <div id="slider-list">
    <div id="slider-empty">write <span style="color:var(--blue);font-family:'Space Mono',monospace">slider('name')</span> in your code and eval to create a slider</div>
  </div>
</div>

<div id="slider-panel"><div id="slider-empty" style="padding:0 1rem;font-size:0.62rem;color:var(--muted);font-style:italic">write <span style="color:var(--blue);font-family:'Space Mono',monospace">slider('name')</span> in your code and ctrl+enter</div><button id="slider-panel-close" onclick="toggleSliders()">✕</button></div>

<!-- Prebake Modal -->
<div id="pb-overlay" onclick="pbOverlayClick(event)">
  <div id="pb-modal">
    <div id="pb-modal-head">
      <h2>prebake</h2>
      <button class="pb-close-btn" onclick="closePbModal()">✕</button>
    </div>

    <!-- target tabs -->
    <div class="pb-tabs">
      <div class="pb-tab active" data-pb="strudel" onclick="switchPbTab('strudel', this)">strudel</div>
      <div class="pb-tab" data-pb="hydra" onclick="switchPbTab('hydra', this)">hydra</div>
    </div>

    <!-- File upload -->
    <div class="pb-section">
      <span class="pb-label">load from file</span>
      <div class="pb-url-row">
        <label class="pb-btn pb-btn-primary" style="cursor:pointer;display:flex;align-items:center;gap:0.4rem">
          ↑ choose file
          <input id="pb-file" type="file" accept=".strudel,.js,.txt" style="display:none"
                 onchange="loadPbFromFile(this)" />
        </label>
        <span class="pb-status" id="pb-url-status" style="display:flex;align-items:center;padding:0 0.5rem"></span>
      </div>
    </div>

    <!-- Code editor -->
    <div class="pb-section">
      <span class="pb-label">or paste / edit directly</span>
      <textarea id="pb-code" class="pb-textarea"
                placeholder="// custom functions, samples, registers…
// e.g. for strudel:
samples('github:tidalcycles/Dirt-Samples/master/')
register('env', (x, pat) => pat.attack(x).decay(x).sustain(0.5))

// e.g. for hydra:
// bpm = 120"></textarea>
    </div>

    <div class="pb-footer">
      <span class="pb-active-pill" id="pb-active-pill">● prebake active</span>
      <div style="display:flex;gap:0.5rem;margin-left:auto">
        <button class="pb-btn pb-btn-ghost" onclick="clearPrebake()">clear</button>
        <button class="pb-btn pb-btn-primary" onclick="applyPrebake()">apply</button>
      </div>
    </div>
  </div>
</div>

<div id="log"></div>
<div id="flash"></div>

<script>
  // ── STATE ──────────────────────────────
  let panes = [], paneCount = 0, logVis = false;
  let hydraInstance = null; // single Hydra instance, shared
  let strudelPrebake = '';   // prebake code run before each strudel eval
  const sliders = {};           // { name: { value, min, max, step } }
  let slidersVisible = false;
  let hydraPrebake   = '';   // prebake code prepended to each hydra eval

  const STARTERS = {
    strudel: `// strudel — ctrl+enter to play`,
    hydra:   'osc(10, 0.1, 1.5)\n  .color(0.05, 0.1, 0.7)\n  .rotate([0.2,0.4], 0.01)\n  .out()',
    tidal:   '-- needs local SuperCollider + flok-eval\nd1 $ s "bd ~ sd ~"\n\nd2 $ n (slow 2 $ run 8) # s "arpy"\n   # gain 0.8'
  };

  // ── HYDRA SETUP ────────────────────────
  // One Hydra instance pointed at the full-screen canvas.
  // We call this lazily on first hydra eval, so the canvas is visible first.
  function getHydra() {
    if (hydraInstance) return hydraInstance;
    const canvas = document.getElementById('hc');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';
    // makeGlobal: true — puts osc/src/out/etc on window.
    // This is fine because we only ever have ONE Hydra instance.
    // Strudel doesn't use these names.
    hydraInstance = new Hydra({ canvas, detectAudio: false, makeGlobal: true });
    return hydraInstance;
  }

  window.addEventListener('resize', () => {
    const canvas = document.getElementById('hc');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    if (hydraInstance) {
      try { hydraInstance.setResolution(window.innerWidth, window.innerHeight); } catch(e) {}
    }
  });

  function showHydraCanvas(show) {
    document.getElementById('hc').style.display = show ? 'block' : 'none';
  }

  // ── BOOT ───────────────────────────────
  window.addEventListener('load', () => { addPane('strudel'); buildPal(); });

  // ── PANE MANAGEMENT ────────────────────
  function addPane(target = 'strudel') {
    if (panes.length >= 3) return;
    const id = ++paneCount;

    // Header tab
    const ph = document.createElement('div');
    ph.className = 'ph'; ph.id = `ph-${id}`;

    const tBtn = document.createElement('button');
    tBtn.className = 'target-btn';
    tBtn.innerHTML = `<span class="tlbl">${target === 'tidal' ? 'TidalCycles' : target}</span><span class="caret">▾</span>`;
    tBtn.onclick = e => { e.stopPropagation(); toggleDD(id); };

    const dd = document.createElement('div');
    dd.className = 'target-dd'; dd.id = `dd-${id}`;
    ['strudel','hydra','tidal'].forEach(t => {
      const o = document.createElement('div');
      o.className = 'topt' + (t === target ? ' active' : '');
      o.textContent = t === 'tidal' ? 'TidalCycles' : t;
      o.dataset.t = t;
      o.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); });
      o.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setPaneTarget(id, t); });
      o.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); setPaneTarget(id, t); });
      dd.appendChild(o);
    });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'ph-close'; closeBtn.textContent = '✕';
    closeBtn.onclick = () => removePane(id);

    ph.appendChild(tBtn); ph.appendChild(closeBtn);
    document.body.appendChild(dd); // fixed overlay, not inside topbar stacking context
    document.getElementById('pane-headers').appendChild(ph);

    // Editor pane
    const paneEl = document.createElement('div');
    paneEl.className = 'pane' + (target === 'hydra' ? ' is-hydra' : '');
    paneEl.id = `pane-${id}`;

    const ta = document.createElement('textarea');
    ta.className = 'pane-editor'; ta.spellcheck = false;
    ta.value = STARTERS[target] || '';
    ta.addEventListener('keydown', e => editorKey(e, id));

    const se = document.createElement('div');
    se.className = 'se'; se.id = `se-${id}`;

    paneEl.appendChild(ta); paneEl.appendChild(se);
    document.getElementById('panes').appendChild(paneEl);

    const pane = { id, target, ph, paneEl, editor: ta,
                   strudelEl: null, strudelReady: false };
    panes.push(pane);

    if (target === 'strudel') initStrudel(pane);
    syncHydra();
    return pane;
  }

  function removePane(id) {
    if (panes.length <= 1) return;
    const idx = panes.findIndex(p => p.id === id);
    if (idx < 0) return;
    stopStrudel(panes[idx]);
    panes[idx].ph.remove();
    panes[idx].paneEl.remove();
    panes.splice(idx, 1);
    syncHydra();
  }

  function setPaneTarget(id, target) {
    const p = panes.find(p => p.id === id);
    if (!p) return;
    closeAllDD();
    if (p.target === target) return;
    if (p.target === 'strudel') stopStrudel(p);
    p.target = target;
    p.editor.value = STARTERS[target] || '';
    p.ph.querySelector('.tlbl').textContent = target === 'tidal' ? 'TidalCycles' : target;
    p.ph.querySelectorAll('.topt').forEach(o => o.classList.toggle('active', o.dataset.t === target));
    p.paneEl.classList.toggle('is-hydra', target === 'hydra');
    if (target === 'strudel' && !p.strudelReady) initStrudel(p);
    syncHydra();
  }

  function syncHydra() {
    const hasHydra = panes.some(p => p.target === 'hydra');
    showHydraCanvas(hasHydra);
  }

  // ── STRUDEL ────────────────────────────
  function initStrudel(pane) {
    customElements.whenDefined('strudel-editor').then(() => {
      if (pane.strudelEl) return;
      const wrap = document.getElementById(`se-${pane.id}`);
      const el = document.createElement('strudel-editor');
      el.setAttribute('code', '-- ready');
      wrap.appendChild(el);
      pane.strudelEl = el;
      pane.strudelReady = true;
    }).catch(e => log('strudel: ' + e.message, 'err'));
  }

  function stopStrudel(pane) {
    if (!pane.strudelEl) return;
    try {
      const inst = pane.strudelEl.editor || pane.strudelEl;
      if (typeof inst.stop === 'function') inst.stop();
      else if (typeof pane.strudelEl.stop === 'function') pane.strudelEl.stop();
    } catch(e) {}
  }

  // ── EVAL ───────────────────────────────

  // ── SLIDER PREPROCESSING ─────────────────────────────────────────────
  // Parse slider() calls from code, create widgets, substitute current values.
  // Works for ALL targets since substitution happens before any eval.
  // Patterns matched:
  //   slider()
  //   slider(0.5)
  //   slider('name')
  //   slider('name', 0.5)
  //   slider('name', 0.5, 0, 1)
  //   slider('name', 0.5, 0, 1, 0.01)

  function preprocessSliders(code) {
    let autoIdx = 0;

    // Match slider( ... ) — handle nested parens carefully with a simple greedy match
    // Since slider args are just numbers/strings, this regex is sufficient
    const re = /slider\(([^)]*)\)/g;

    return code.replace(re, (match, argsStr) => {
      // Parse args
      const args = parseSliderArgs(argsStr.trim());

      let name, def, min, max, step;

      if (args.length === 0) {
        // slider()
        name = null; def = 0.5;
      } else if (typeof args[0] === 'string') {
        // slider('name', ...)
        name = args[0];
        def  = args[1] !== undefined ? args[1] : 0.5;
        min  = args[2]; max = args[3]; step = args[4];
      } else {
        // slider(0.5, ...)
        name = null;
        def  = args[0] !== undefined ? args[0] : 0.5;
        min  = args[1]; max = args[2]; step = args[3];
      }

      // Auto-name
      if (!name) name = 's' + (++autoIdx);

      // Smart defaults
      const smart = smartSliderRange(def);
      const rMin  = min  !== undefined ? min  : smart.mn;
      const rMax  = max  !== undefined ? max  : smart.mx;
      const rStep = step !== undefined ? step : smart.st;

      // Create or update slider widget
      if (!sliders[name]) {
        sliders[name] = { value: def, min: rMin, max: rMax, step: rStep };
        needSliderRender = true;
        if (!slidersVisible) { toggleSliders(); }
      } else {
        sliders[name].min  = rMin;
        sliders[name].max  = rMax;
        sliders[name].step = rStep;
        sliders[name].value = Math.min(rMax, Math.max(rMin, sliders[name].value));
        renderSliderItem(name);
      }

      // Return the current value as a number literal
      return String(sliders[name].value);
    });
  }

  let needSliderRender = false;

  function smartSliderRange(val) {
    if (val === 0) return { mn: -1, mx: 1, st: 0.01 };
    if (val > 0) {
      const order = Math.pow(10, Math.floor(Math.log10(Math.abs(val))));
      return { mn: 0, mx: val * 4, st: Math.max(order / 100, 0.001) };
    }
    const order = Math.pow(10, Math.floor(Math.log10(Math.abs(val))));
    return { mn: val * 4, mx: 0, st: Math.max(order / 100, 0.001) };
  }

  function parseSliderArgs(str) {
    if (!str) return [];
    const args = [];
    // Split by comma but respect string quotes
    let current = '', inStr = false, strChar = '';
    for (let i = 0; i < str.length; i++) {
      const c = str[i];
      if (inStr) {
        if (c === strChar) inStr = false;
        else current += c;
      } else if (c === '"' || c === "'") {
        inStr = true; strChar = c;
      } else if (c === ',') {
        args.push(coerceArg(current.trim()));
        current = '';
      } else {
        current += c;
      }
    }
    if (current.trim()) args.push(coerceArg(current.trim()));
    return args;
  }

  function coerceArg(s) {
    if (!s) return undefined;
    const n = parseFloat(s);
    return isNaN(n) ? s : n; // string or number
  }


  async function evalPane(id) {
    const p = panes.find(p => p.id === id);
    if (!p) return;
    doFlash();
    const raw = getCode(p.editor);
    if (!raw.trim()) return;

    // Preprocess slider() calls — substitutes values and creates widgets
    needSliderRender = false;
    const processed = preprocessSliders(raw);
    if (needSliderRender) renderSliders();

    if (p.target === 'strudel') {
      const fullCode = strudelPrebake ? strudelPrebake + '\n' + processed : processed;
      await evalStrudel(p, fullCode);
    } else if (p.target === 'hydra') {
      const stripped = processed.split('\n').filter(l => !l.trim().startsWith('--')).join('\n').trim();
      const code = hydraPrebake ? hydraPrebake + '\n' + stripped : stripped;
      evalHydra(code);
    } else {
      log('TidalCycles: needs local SuperCollider + flok-eval relay', 'info');
    }
  }

  async function evalStrudel(p, code) {
    if (!p.strudelReady || !p.strudelEl) { log('strudel loading…', 'err'); return; }
    try {
      // strudel-editor handles its own transpilation (d1/d2/$, mini-notation, etc.)
      // Code arrives already processed (prebake prepended, slider() substituted)
      p.strudelEl.setAttribute('code', code);
      // Wait for lit element to process attribute
      if (p.strudelEl.updateComplete) await p.strudelEl.updateComplete.catch(() => {});
      // Try all known evaluate paths
      let evaluated = false;
      if (typeof p.strudelEl.evaluate === 'function') {
        await p.strudelEl.evaluate(code); evaluated = true;
      } else if (p.strudelEl.editor && typeof p.strudelEl.editor.evaluate === 'function') {
        await p.strudelEl.editor.evaluate(code); evaluated = true;
      } else if (p.strudelEl.repl && typeof p.strudelEl.repl.evaluate === 'function') {
        await p.strudelEl.repl.evaluate(code); evaluated = true;
      }
      if (!evaluated) log('strudel: evaluate() not found — try clicking play in the editor', 'info');
      setStatus('playing'); log('eval → strudel', 'ok');
    } catch(e) { setStatus('error'); log('strudel: ' + e.message, 'err'); }
  }

  function evalHydra(code) {
    try {
      // Ensure canvas is ready and Hydra is initialised
      const h = getHydra();
      if (!h) { log('hydra not ready', 'err'); return; }
      // makeGlobal:true means osc/out/etc are already on window — just eval
      // eslint-disable-next-line no-new-func
      new Function(code)();
      setStatus('playing'); log('eval → hydra', 'ok');
    } catch(e) { setStatus('error'); log('hydra: ' + e.message, 'err'); }
  }

  function silenceAll() {
    panes.forEach(p => { if (p.target === 'strudel') stopStrudel(p); });
    setStatus('idle'); log('silence', 'err');
  }

  function getCode(ta) {
    const sel = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
    return sel || ta.value;
  }

  // ── UI HELPERS ─────────────────────────
  function toggleDD(id) {
    const dd = document.getElementById(`dd-${id}`);
    const was = dd.classList.contains('open');
    closeAllDD();
    if (!was) {
      // Position fixed dropdown below the button
      const btn = document.querySelector(`#ph-${id} .target-btn`);
      const rect = btn.getBoundingClientRect();
      dd.style.top  = rect.bottom + 'px';
      dd.style.left = rect.left + 'px';
      dd.classList.add('open');
    }
  }

  function closeAllDD() {
    document.querySelectorAll('.target-dd').forEach(d => d.classList.remove('open'));
  }

  document.addEventListener('click', e => { if (!e.target.closest('.target-dd') && !e.target.closest('.target-btn')) setTimeout(closeAllDD, 50); });

  function setStatus(s) {
    document.getElementById('sdot').className = 'sdot' + (s !== 'idle' ? ' ' + s : '');
  }

  function doFlash() {
    const f = document.getElementById('flash');
    f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120);
  }

  function editorKey(e, id) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); evalPane(id); }
    if ((e.ctrlKey || e.metaKey) && e.key === '.')     { e.preventDefault(); silenceAll(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'j') {
      e.preventDefault();
      document.getElementById('pal-bg').classList.contains('open') ? closePal() : openPal();
    }
    if (e.key === 'Escape') closePal();
  });

  function log(msg, type = '') {
    const wrap = document.getElementById('log');
    const line = document.createElement('div');
    line.className = 'll' + (type ? ' ' + type : '');
    line.textContent = `[${new Date().toTimeString().slice(0,8)}] ${msg}`;
    wrap.prepend(line);
    if (type === 'err' || type === 'info') showLog();
  }

  function showLog() { logVis = true; document.getElementById('log').classList.add('vis'); }
  function toggleLog() {
    logVis = !logVis; document.getElementById('log').classList.toggle('vis', logVis);
  }



  // ── SLIDERS ────────────────────────────────────────────────────────
  // window.__mokSlider is the global slider() function injected into every eval.
  // Usage: slider('name', defaultVal, min, max, step)
  // First call creates the slider widget and returns defaultVal.
  // Subsequent evals return the current dragged value.

  let _sliderAutoIdx = 0; // auto-increment for unnamed sliders


  function toggleSliders() {
    slidersVisible = !slidersVisible;
    document.getElementById('slider-panel').classList.toggle('vis', slidersVisible);
  }

  function removeSlider(name) {
    delete sliders[name];
    renderSliders();
  }

  function renderSliderItem(name) {
    const item = document.querySelector(`.sl-item[data-name="${name}"]`);
    if (!item) return;
    const s = sliders[name];
    const range = item.querySelector('.sl-range');
    if (range) { range.min = s.min; range.max = s.max; range.step = s.step; range.value = s.value; }
    const disp = item.querySelector('.sl-value-display');
    if (disp) disp.textContent = formatVal(s.value);
  }

  function renderSliders() {
    const panel = document.getElementById('slider-panel');
    const empty = document.getElementById('slider-empty');
    const close = document.getElementById('slider-panel-close');
    const names = Object.keys(sliders);

    // Remove existing sl-items
    panel.querySelectorAll('.sl-item').forEach(el => el.remove());

    empty.style.display = names.length ? 'none' : 'block';

    // Insert items before the close button
    names.forEach(name => {
      const s = sliders[name];
      const item = document.createElement('div');
      item.className = 'sl-item';
      item.dataset.name = name;
      item.innerHTML =
        `<span class="sl-name">${name}</span>` +
        `<input class="sl-range" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}" oninput="updateSlider('${name}', parseFloat(this.value))">` +
        `<span class="sl-value-display">${formatVal(s.value)}</span>` +
        `<button class="sl-remove" onclick="removeSlider('${name}')">✕</button>`;
      panel.insertBefore(item, close);
    });
  }

  function formatVal(v) {
    // Show up to 4 sig figs without trailing zeros
    if (Number.isInteger(v)) return String(v);
    return parseFloat(v.toPrecision(4)).toString();
  }

  function updateSlider(name, value) {
    if (!sliders[name]) return;
    sliders[name].value = value;
    const item = document.querySelector(`.sl-item[data-name="${name}"]`);
    if (item) item.querySelector('.sl-value-display').textContent = formatVal(value);
    // Re-eval active pane so slider change is heard immediately
    const p = panes.find(p => p.editor === document.activeElement) || panes[0];
    if (p) evalPane(p.id);
  }

  // ── PREBAKE ────────────────────────────────────────────────────────
  let currentPbTarget = 'strudel';

  function openPbModal() {
    const target = activePane()?.target || 'strudel';
    switchPbTab(target === 'hydra' ? 'hydra' : 'strudel', null);
    const code = target === 'hydra' ? hydraPrebake : strudelPrebake;
    document.getElementById('pb-code').value = code;
    updatePbActivePill();
    document.getElementById('pb-overlay').classList.add('open');
  }

  function closePbModal() {
    document.getElementById('pb-overlay').classList.remove('open');
  }

  function pbOverlayClick(e) {
    if (e.target === document.getElementById('pb-overlay')) closePbModal();
  }

  function switchPbTab(target, el) {
    currentPbTarget = target;
    document.querySelectorAll('.pb-tab').forEach(t => t.classList.remove('active'));
    (el || document.querySelector(`.pb-tab[data-pb="${target}"]`))?.classList.add('active');
    const code = target === 'hydra' ? hydraPrebake : strudelPrebake;
    document.getElementById('pb-code').value = code;
    document.getElementById('pb-url-status').textContent = '';
    updatePbActivePill();
  }

  function loadPbFromFile(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('pb-url-status');
    status.className = 'pb-status';
    status.textContent = 'reading…';
    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result;
      document.getElementById('pb-code').value = text;
      status.className = 'pb-status ok';
      status.textContent = `✓ ${file.name} (${text.split('\n').length} lines)`;
    };
    reader.onerror = () => {
      status.className = 'pb-status err';
      status.textContent = 'error reading file';
    };
    reader.readAsText(file);
  }

  function applyPrebake() {
    const code = document.getElementById('pb-code').value.trim();
    if (currentPbTarget === 'hydra') {
      hydraPrebake = code;
    } else {
      strudelPrebake = code;
    }
    updatePbActivePill();
    log(`prebake applied (${currentPbTarget}, ${code.split('\n').length} lines)`, 'ok');
    closePbModal();
  }

  function clearPrebake() {
    document.getElementById('pb-code').value = '';
    document.getElementById('pb-url-status').textContent = '';
    if (currentPbTarget === 'hydra') hydraPrebake = '';
    else strudelPrebake = '';
    updatePbActivePill();
    log(`prebake cleared (${currentPbTarget})`, 'info');
  }

  function updatePbActivePill() {
    const active = currentPbTarget === 'hydra' ? hydraPrebake : strudelPrebake;
    document.getElementById('pb-active-pill').classList.toggle('visible', active.length > 0);
  }

  // ── PALETTE ────────────────────────────
  const CMDS = [
    { sec:'Panes',    ico:'+', label:'Add Strudel pane',     action:() => { addPane('strudel');  closePal(); } },
    { sec:'Panes',    ico:'+', label:'Add Hydra pane',       action:() => { addPane('hydra');    closePal(); } },
    { sec:'Panes',    ico:'+', label:'Add TidalCycles pane', action:() => { addPane('tidal');    closePal(); } },
    { sec:'Panes',    ico:'✕', label:'Remove active pane',   action:() => { const p = activePane(); if (p) removePane(p.id); closePal(); } },
    { sec:'Sliders',  ico:'⧖', label:'Toggle slider panel', action:() => { toggleSliders(); closePal(); } },
    { sec:'Sliders',  ico:'✕', label:'Clear all sliders', action:() => { Object.keys(sliders).forEach(removeSlider); closePal(); } },
    { sec:'Prebake',  ico:'⚙', label:'Load prebake…', action:() => { openPbModal(); closePal(); } },
    { sec:'Session',  ico:'⎘', label:'Copy session link',    action:() => { navigator.clipboard.writeText(location.href).then(()=>log('link copied','ok')); closePal(); } },
    { sec:'Playback', ico:'■', label:'Silence all', sc:'Ctrl+.', action:() => { silenceAll(); closePal(); } },
  ];

  let filtered = [...CMDS], focusIdx = 0;

  function activePane() {
    return panes.find(p => p.editor === document.activeElement) || panes[0];
  }

  function buildPal(q = '') {
    filtered = CMDS.filter(c => !q || c.label.toLowerCase().includes(q.toLowerCase()));
    focusIdx = 0;
    const body = document.getElementById('pal-body');
    body.innerHTML = '';
    let lastSec = '';
    filtered.forEach((cmd, i) => {
      if (cmd.sec !== lastSec) {
        const s = document.createElement('div');
        s.className = 'ps'; s.textContent = cmd.sec;
        body.appendChild(s); lastSec = cmd.sec;
      }
      const item = document.createElement('div');
      item.className = 'pi' + (i === 0 ? ' focused' : '');
      item.innerHTML = `<span class="ico">${cmd.ico}</span>${cmd.label}<span class="sc">${cmd.sc||''}</span>`;
      item.onclick = cmd.action;
      body.appendChild(item);
    });
  }

  function filterPal(v) { buildPal(v); }
  function palNav(e) {
    const items = document.querySelectorAll('.pi');
    if      (e.key === 'ArrowDown') focusIdx = Math.min(focusIdx+1, filtered.length-1);
    else if (e.key === 'ArrowUp')   focusIdx = Math.max(focusIdx-1, 0);
    else if (e.key === 'Enter')     { filtered[focusIdx]?.action(); return; }
    else return;
    items.forEach((el,i) => el.classList.toggle('focused', i === focusIdx));
  }

  function openPal() {
    document.getElementById('pal-bg').classList.add('open');
    document.getElementById('pal-in').value = '';
    buildPal();
    setTimeout(() => document.getElementById('pal-in').focus(), 40);
  }

  function closePal() { document.getElementById('pal-bg').classList.remove('open'); }
  function palBgClick(e) { if (e.target === document.getElementById('pal-bg')) closePal(); }
</script>
</body>
